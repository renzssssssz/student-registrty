<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registry</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background-color: #f2e88d;
  }

  .registry-container {
    background-color: #fff3b8;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
    width: 350px;
    text-align: center;
  }

  .registry-container h2 {
    margin-bottom: 20px;
    color: #5b3e2b;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  input {
    width: 90%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 15px;
    border: 1px solid #ddd;
    font-size: 14px;
    outline: none;
  }

  button#save-btn {
    width: 97%;
    padding: 12px;
    background-color: #ff7f50;
    border: none;
    border-radius: 15px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.3s;
  }

  button#save-btn:hover {
    background-color: #ff6347;
  }

  .student-list {
    margin-top: 25px;
    text-align: left;
    max-height: 300px;
    overflow-y: auto;
  }

  .student-item {
    background-color: #a7e8d2;
    padding: 12px;
    border-radius: 15px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
  }

  .student-info {
    font-size: 14px;
    color: #333;
    line-height: 1.4;
  }

  .delete-btn {
    background-color: #ff4d4d;
    color: white;
    border: none;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
    margin-left: 10px;
  }

  .delete-btn:hover {
    background-color: #d43f3f;
  }
</style>
</head>
<body>

<div class="registry-container">
  <h2>Student Registry</h2>
  <input type="text" id="name" placeholder="Full Name">
  <input type="text" id="course" placeholder="Course">
  <input type="text" id="year" placeholder="Year Level">
  <button id="save-btn" onclick="addStudent()">SAVE TO FIRESTORE</button>

  <div class="student-list" id="studentList">
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  // ⚠️ PASTE YOUR CONFIG HERE FROM STEP 2 ⚠️
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const studentListContainer = document.getElementById('studentList');

  // FUNCTION: Add student to Firestore
  function addStudent() {
    const name = document.getElementById('name').value.trim();
    const course = document.getElementById('course').value.trim();
    const year = document.getElementById('year').value.trim();

    if(name && course && year) {
      db.collection('students').add({
        name: name,
        course: course,
        year: year,
        createdAt: firebase.firestore.FieldValue.serverTimestamp() // For sorting
      })
      .then(() => {
        // Clear inputs after success
        document.getElementById('name').value = '';
        document.getElementById('course').value = '';
        document.getElementById('year').value = '';
      })
      .catch((error) => alert("Error: " + error.message));
    } else {
      alert('Please fill out all fields!');
    }
  }

  // FUNCTION: Delete student from Firestore
  function deleteStudent(id) {
    if(confirm("Are you sure you want to delete this record?")) {
      db.collection('students').doc(id).delete()
      .catch((error) => console.error("Error removing document: ", error));
    }
  }

  // REAL-TIME LISTENER: Updates UI whenever Firestore changes
  db.collection('students').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
    studentListContainer.innerHTML = ''; // Clear current list
    
    snapshot.forEach((doc) => {
      const data = doc.data();
      const id = doc.id;

      // Create list item element
      const studentItem = document.createElement('div');
      studentItem.className = 'student-item';
      
      studentItem.innerHTML = `
        <div class="student-info">
          <strong>${data.name}</strong><br>
          ${data.course} - Year ${data.year}
        </div>
        <button class="delete-btn" onclick="deleteStudent('${id}')">✕</button>
      `;

      studentListContainer.appendChild(studentItem);
    });
  });
</script>

</body>
</html>
